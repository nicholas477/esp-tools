name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Check code formatting
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check formatting
        run: cargo fmt --check

  # Clippy linter
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable caching
        uses: Swatinem/rust-cache@v2

      - name: Install clippy
        run: rustup component add clippy

      - name: Run clippy linter
        run: cargo clippy -- -D warnings

  build:
    name: Rust project - ${{ matrix.NAME }}
    runs-on: ${{ matrix.OS }}
    env:
      NAME: esp-tools
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    strategy:
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
            OS: ubuntu-latest
            NAME: linux
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            NAME: windows
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install rust target
        run: rustup target add $TARGET

      - name: Enable caching
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose --target $TARGET

      - name: List target
        run: find ./target

      - name: Compress
        run: |
          mkdir -p ./artifacts
          # windows is the only OS using a different convention for executable file name
          if [[ $OS =~ ^windows.*$ ]]; then
              EXEC=$NAME.exe
          else
              EXEC=$NAME
          fi

          mv ./target/$TARGET/release/$EXEC ./artifacts/$EXEC

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-tools-${{ matrix.NAME }}-${{ github.sha }}
          path: |
            ./artifacts

  windows-msi:
    name: Windows MSI
    needs: build
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: esp-tools-windows-${{ github.sha }}
          path: ./artifacts

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI
        run: cargo wix --target $TARGET --target-bin-dir ./artifacts --no-build --nocapture

      - name: Archive MSI
        uses: actions/upload-artifact@v4
        with:
          name: esp-tools-windows-msi-${{ github.sha }}
          path: ./target/wix/*.msi

  test:
    name: Test
    needs: build
    runs-on: ${{ matrix.OS }}
    env:
      NAME: esp-tools
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    strategy:
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
            OS: ubuntu-latest
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install rust target
        run: rustup target add $TARGET
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - run: cargo test --release --verbose --target $TARGET

  # deploys to github releases on tag
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, windows-msi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
            NAME: linux
            ASSET: zip
          - TARGET: x86_64-pc-windows-msvc
            NAME: windows
            ASSET: zip
          - TARGET: x86_64-pc-windows-msvc
            NAME: windows-msi
            ASSET: msi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: esp-tools-${{ matrix.NAME }}-${{ github.sha }}
          path: ./artifacts
      - name: List
        run: find ./artifacts
      - name: Compress
        if: matrix.ASSET == 'zip'
        run: |
          mkdir -p release
          cd artifacts
          zip ../release/esp-tools-${{ matrix.name }}-${{ github.ref_name }}.zip ./*
      - name: Stage MSI
        if: matrix.ASSET == 'msi'
        run: |
          mkdir -p release
          cp ./artifacts/*.msi ./release/
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/*
